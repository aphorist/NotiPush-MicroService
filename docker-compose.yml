services:
  push-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: NotiPush-MicroService
    restart: unless-stopped
    ports:
      - "${NOTIPUSH_PORT:-8180}:${NOTIPUSH_PORT:-8180}"
    environment:
      # URL ของ NotiPush API (เปลี่ยนเป็น Endpoint จริงที่ต้องการ)
      - NOTIPUSH_URL=https://notipush.app/api/send-push
      # Port ที่ต้องการให้ Service รัน (Default: 8180)
      - NOTIPUSH_PORT=${NOTIPUSH_PORT:-8180}
      # Bearer token สำหรับ auth ฝั่ง inbound ที่ endpoint /send-push
      - INBOUND_BEARER_TOKEN=${INBOUND_BEARER_TOKEN:-}
      # IPs ที่อนุญาตให้ส่ง Push (คั่นด้วย comma) ใช้เป็น fallback ได้ถ้าไม่มี bearer token
      - ALLOWED_IPS=${ALLOWED_IPS:-127.0.0.1,localhost,::1}
      - DEBUG=${DEBUG:-false}
      # ใส่ Token ถ้า API ปลายทางบังคับใช้ (outbound Authorization header)
      #- NOTIPUSH_TOKEN=Bearer YOUR_API_KEY
    volumes:
      # Mount .env so the service can read TPS and other runtime settings directly.
      - ./.env:/app/.env:ro
      # ทำ Volume Mount ผูกโฟลเดอร์ push_data ในเครื่องโฮสต์เข้ากับ /app/data ใน Container
      # เพื่อป้องกันคิวสูญหายเมื่อ Container ถูกลบหรือรีสตาร์ท
      - ./push_data:/app/data